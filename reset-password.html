<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ultra Fast Fluency</title>
    <link href="./node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b1a2a;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            background-color: #1a3a5a;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            background-color: #2a4a6a;
            border: 1px solid #3a5a7a;
            color: white;
        }
        .form-control:focus {
            background-color: #2a4a6a;
            color: white;
            border-color: #4a6a8a;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .text-center a {
            color: #8bb4e7;
            text-decoration: none;
        }
        .text-center a:hover {
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: yellow;">Set New Password</h2>
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
    <div id="success-message" class="alert alert-success d-none" role="alert">Password updated successfully! <a href="login.html" class="alert-link">Log in now</a>.</div>

    <form id="reset-form">
        <div class="mb-3">
            <label for="password" class="form-label">New Password (min 8 chars)</label>
            <input type="password" class="form-control" id="password" required minlength="8">
        </div>
        <div class="mb-3">
            <label for="password-confirm" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="password-confirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" id="reset-btn">Update Password</button>
    </form>
</div>

<script type="module">
    import { account } from './js/modules/api/appwrite.js';

    document.addEventListener('DOMContentLoaded', () => {
        const resetForm = document.getElementById('reset-form');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const resetBtn = document.getElementById('reset-btn');

        // Appwrite passes these parameters in the URL from the email link
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');

        if (!userId || !secret) {
            errorMsg.textContent = "Invalid password reset link. Please request a new one.";
            errorMsg.classList.remove('d-none');
            resetForm.style.display = 'none';
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('d-none');

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            if (password !== passwordConfirm) {
                errorMsg.textContent = "Passwords do not match.";
                errorMsg.classList.remove('d-none');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Updating...';

            try {
                await account.updateRecovery(userId, secret, password, passwordConfirm);

                successMsg.classList.remove('d-none');
                resetForm.style.display = 'none';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('d-none');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Update Password';
            }
        });
    });
</script>

</body>
</html>
