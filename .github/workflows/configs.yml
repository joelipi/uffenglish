name: Generate Course Configs

# Best-effort: generate one src/config/<courseId>.json per course the
# committed master CSV defines and commit them. A course with any missing
# required column is skipped whole and REPORTED (annotation + job summary);
# the job stays green so nothing downstream is blocked. The video render is a
# separate path (Modal), so a skip here never affects it.
#
# The CSV is read from disk: a chained run checks out the repo fresh after the
# preceding job's push, so it always sees the `srt` / `phrase_*` cells the
# earlier jobs just committed — no API, no publish lag. Trigger: the manual
# "Run workflow" button, or the one-click pipeline.yml chain
# (`workflow_call`); pipeline.yml owns `render-complete`.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Shared with every workflow that touches the committed master CSV, so a
# config run never reads a half-written file. `queue: max` keeps queued runs
# (instead of GitHub cancelling the older pending one), so a burst of renders
# never drops a config regeneration.
concurrency:
  group: master-csv
  cancel-in-progress: false
  queue: max

jobs:
  configs:
    runs-on: ubuntu-latest
    # Null-safe across all events: only `push` has head_commit, and the guard
    # must also skip the bot's own commit (loop guard).
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip configs]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Generate configs
        run: |
          set -o pipefail
          node scripts/generate-config-from-sheet.mjs --check 2>&1 | tee /tmp/configs.log
      - name: Report skips
        if: always()
        run: |
          {
            echo "## Config generation"
            grep '^SKIP course ' /tmp/configs.log || echo "No skipped courses."
          } >> "$GITHUB_STEP_SUMMARY"
          # Missing-column skips are the only real problems (the CSV needs
          # fixing) -> annotate as errors. Structural/invalid-courseId skips are
          # summarized but not annotated. Overwrite is unconditional now (story
          # 047), so there is no "already exists" skip.
          grep '^SKIP course ' /tmp/configs.log | grep 'missing required column' | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Commit configs
        run: |
          git config user.name "uff-configs-bot"
          git config user.email "11131426+joelipi@users.noreply.github.com"
          git add src/config scripts/lib/generated-configs.json
          if git diff --cached --quiet; then
            echo "no config changes"
          else
            git commit -m "chore(configs): regenerate course configs from the master CSV [skip configs]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
