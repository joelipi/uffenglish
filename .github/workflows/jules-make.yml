name: Jules Make Pipeline

on:
  issues:
    types: [labeled]

jobs:
  build:
    if: ${{ github.event.label.name == 'jules-make' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd .github/scripts && npm install

      - name: Fetch relevant files
        id: fetch_files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/fetch_files.js

      - name: Select relevant files
        id: select_files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FILE_LIST: ${{ steps.fetch_files.outputs.file_list }}
        run: node .github/scripts/select_files.js

      - name: Fetch file contents
        id: fetch_contents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_FILES: ${{ steps.select_files.outputs.selected_files }}
        run: node .github/scripts/fetch_contents.js

      - name: Generate spec
        id: generate_spec
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/generate_spec.js

      - name: Enrich spec
        id: enrich_spec
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/enrich_spec.js

      - name: Final review
        id: final_review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/enrich_spec_2.js

      - name: Trigger Jules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/trigger_jules.js