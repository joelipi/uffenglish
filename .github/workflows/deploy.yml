name: Deploy to Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Run unit tests
        run: npm test -- --run


      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate posters
        run: node scripts/generate-thumbnails.mjs

      - name: Upload posters to R2
        # Runs on all branches: preview deployments serve posters from R2
        # (getPosterUrl uses POSTER_BASE outside DEV), so a branch that skips
        # this shows gradient fallbacks instead of posters. Poster output is
        # deterministic per lessonId, so a branch upload is safe; main
        # re-uploads on merge.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/generate-thumbnails.mjs --upload

      - name: Verify posters present
        run: node scripts/verify-thumbnails.mjs

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch makes non-main pushes create a preview deployment at
          # <branch>.uffenglish.pages.dev instead of overwriting production.
          # Branch names are lowercased and non-alphanumerics become '-'.
          command: pages deploy dist --project-name=uffenglish --branch=${{ github.ref_name }}
