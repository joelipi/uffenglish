name: Deploy to Cloudflare Pages

# Production deploy only. Feature-branch preview deploys were dropped: a deploy
# on every branch push (npm ci + ffmpeg + build) was the bulk of the Actions
# minutes. Run `npm test` locally before pushing.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        # Needed by the poster pipeline below. The unit tests now run locally
        # (`npm test`) before pushing, so they are no longer a CI step.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate posters
        run: node scripts/generate-thumbnails.mjs

      - name: Upload posters to R2
        # Posters are slug-keyed and only ever live on R2 (getPosterUrl resolves
        # the slug sibling assets/videos/<slug>.jpg).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/generate-thumbnails.mjs --upload

      - name: Verify posters present
        run: node scripts/verify-thumbnails.mjs

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch makes non-main pushes create a preview deployment at
          # <branch>.uffenglish.pages.dev instead of overwriting production.
          # Branch names are lowercased and non-alphanumerics become '-'.
          command: pages deploy dist --project-name=uffenglish --branch=${{ github.ref_name }}
