name: Deploy to Cloudflare Pages

# Production deploy only. Feature-branch preview deploys were dropped: a deploy
# on every branch push (npm ci + ffmpeg + build) was the bulk of the Actions
# minutes. Run `npm test` locally before pushing.
#
# Posters are NOT built here. The Modal render writes `assets/videos/<slug>.jpg`
# for every slug it publishes (`modal_app._publish`) and for the synthesized
# lesson intros from the sheet's `intro_video` column
# (`modal_app._publish_intro_posters`), so the old generate/upload/verify steps
# were redundant. `scripts/generate-thumbnails.mjs` stays for a manual
# `npm run posters:upload`; it is off the deploy path.
#
# Docs-only pushes are ignored: a markdown/story/plan change ships nothing to
# production, so it must not burn an Actions deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'stories/**'
      - 'plans/**'
      - '.opencode/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch makes non-main pushes create a preview deployment at
          # <branch>.uffenglish.pages.dev instead of overwriting production.
          # Branch names are lowercased and non-alphanumerics become '-'.
          command: pages deploy dist --project-name=uffenglish --branch=${{ github.ref_name }}
