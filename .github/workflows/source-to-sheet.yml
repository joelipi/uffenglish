name: Sync Source to Sheet

# Push-the-button authoring: the operator edits `wouldyourather.source.txt`
# (e.g. directly in the GitHub web UI) and this Action validates it and syncs
# the derived rows into the operator sheet tab the pipeline reads. The source
# file is the authoring truth; the sheet tab is a derived artifact, like
# `src/config/*.json`.
#
# Validation (JSON + structure) runs BEFORE any sheet write: a bad edit fails
# the run red with the reason instead of syncing a half-broken tab. The writer
# also verifies the write with a read-back row count.
on:
  push:
    # main only: this writes the single shared production tab, so an
    # unreviewed branch must never sync — it can only dry-run manually.
    branches: [main]
    paths:
      - wouldyourather.source.txt
      - scripts/write-source-to-sheet.mjs
      - scripts/translate-sheet.mjs
      - scripts/lib/source-bridge-utils.js
      - scripts/lib/sheet-translate-utils.js
      - scripts/lib/cli-utils.js
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and print the plan without writing to the sheet
        type: boolean
        default: false

permissions:
  contents: read

# One global group: this mutates a single shared remote tab, so two
# concurrent runs could interleave a write + trailing clear.
# cancel-in-progress: false so an in-flight run finishes.
concurrency:
  group: source-to-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # No secret-presence skip: a missing secret must be a loud red run, not a
    # silent green one (dry-run still needs all secrets because it reads the
    # sheet tab list).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Sync source to sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SOURCE_SHEET_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SOURCE_SHEET_ID: ${{ vars.SOURCE_SHEET_ID }}
          SOURCE_SHEET_TAB: ${{ vars.SOURCE_SHEET_TAB }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # DRY_RUN is empty-string on push events (no inputs context); the
          # = "true" comparison handles that — do not simplify under set -u.
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          node scripts/write-source-to-sheet.mjs $DRY_RUN_FLAG 2>&1 | tee /tmp/source-sync.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "## Source → sheet sync"
            grep -E '^(SYNCED|CREATED|BRIDGE|\[dry-run\])' /tmp/source-sync.log || echo "No sync lines (check the run output)."
          } >> "$GITHUB_STEP_SUMMARY"
