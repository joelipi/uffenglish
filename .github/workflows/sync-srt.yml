name: Sync SRT to Master CSV

# Manual, or called by the one-click pipeline.yml chain (`workflow_call`). The
# Modal render persists the pipeline-computed `srt` column to R2; this Action
# downloads that CSV, merges the column into the committed master CSV, and
# commits the file. The repo — not a remote sheet — is the output.
# `pipeline.yml` owns the `render-complete` trigger.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Shared with every workflow that mutates the committed CSV, so two writers
# can never interleave a read-modify-write on the same file. `queue: max` (not
# the default single pending slot) keeps queued renders instead of cancelling
# the older pending run.
concurrency:
  group: master-csv
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    # Null-safe across all events: only `push` has head_commit, and the guard
    # must also skip the bot's own commit (loop guard).
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip srt]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Download video_data.csv from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET || secrets.R2_PRIVATE_BUCKET }}
        run: |
          set -euo pipefail
          npx wrangler r2 object get "$R2_PRIVATE_BUCKET/pipeline-assets/video_data.csv" \
            --file=/tmp/video_data.csv
      - name: Write srt into the master CSV
        run: node scripts/write-srt-to-csv.mjs --csv=/tmp/video_data.csv 2>&1 | tee /tmp/srt.log
      - name: Commit master CSV
        run: |
          git config user.name "uff-srt-bot"
          git config user.email "11131426+joelipi@users.noreply.github.com"
          git add public/wouldyourather.master.csv
          if git diff --cached --quiet; then
            echo "no srt changes"
          else
            git commit -m "chore(srt): write pipeline SRT into the master CSV [skip srt]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Summarize
        if: always()
        run: |
          {
            echo "## SRT write-back"
            grep -E '^(WROTE|wrote|no srt)' /tmp/srt.log || echo "No srt lines (check the run output)."
          } >> "$GITHUB_STEP_SUMMARY"
