            if (files.length === 0) {
                appCoreLog("RENDER FAILED: no CSV filenames loaded.");
                return;
            }
            node_render_status.textContent = "RENDER: STARTING...";
            appCoreLog("Starting render for " + files.length + " file(s)...");
            fetch('/api/pipeline/render', {
                method: 'POST',
                headers: {
                    'x-operator-key': operator_key,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ files: files, course: global_recorder_course })
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                return response.json();
            }).then(function(data) {
                appCoreLog("Render job started: " + data.jobId);
                node_render_status.textContent = "RENDER: " + data.jobId;
                pollRenderStatus(data.jobId);
            }).catch(function(err) {
                appCoreLog("RENDER FAILED: " + err.message);
                node_render_status.textContent = "RENDER: FAILED (" + err.message + ")";
            });
        };

        function registerRenderJob(job_id, lesson_label) {
            global_render_jobs[job_id] = { lesson: lesson_label, done: false, state: "running" };
            updateRenderStatusLine();
        }

        function allRenderJobsDone() {
            for (var job_id in global_render_jobs) {
                if (!global_render_jobs.hasOwnProperty(job_id)) { continue; }
                if (!global_render_jobs[job_id].done) { return false; }
            }
            return true;
        }

        function updateRenderStatusLine() {
            var parts = [];
            for (var job_id in global_render_jobs) {
                if (!global_render_jobs.hasOwnProperty(job_id)) { continue; }
                var entry = global_render_jobs[job_id];
                parts.push("LESSON " + entry.lesson + ": " + (entry.done ? "done" : entry.state));
            }
            if (parts.length > 0) {
                node_render_status.textContent = parts.join("; ");
            }
        }

        function pollOneRenderJob(job_id) {
            var entry = global_render_jobs[job_id];
            fetch('/api/pipeline/status' + '?id=' + encodeURIComponent(job_id), {
                headers: { 'x-operator-key': getOperatorKey() }
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                return response.json();
            }).then(function(status) {
                entry.state = status.status + " / " + (status.stage || "-");
                appCoreLog("Render status: " + status.status + " (" + (status.stage || "-") + ")");
                if (status.status === 'done' || status.status === 'error') {
                    entry.done = true;
                    if (allRenderJobsDone()) {
                        if (global_render_poll_timer) {
                            clearInterval(global_render_poll_timer);
                            global_render_poll_timer = null;
                        }
                    }
                }
                updateRenderStatusLine();
            }).catch(function(err) {
                appCoreLog("STATUS POLL FAILED: " + err.message);
            });
        }

        function pollUnfinishedRenderJobs() {
            var pending = [];
            for (var job_id in global_render_jobs) {
                if (!global_render_jobs.hasOwnProperty(job_id)) { continue; }
                if (!global_render_jobs[job_id].done) { pending.push(job_id); }
            }
            if (pending.length === 0) {
                if (global_render_poll_timer) {
                    clearInterval(global_render_poll_timer);
                    global_render_poll_timer = null;
                }
                return;
            }
            for (var i = 0; i < pending.length; i++) {
                pollOneRenderJob(pending[i]);
            }
            updateRenderStatusLine();
        }

        function pollRenderStatus(job_id) {
            registerRenderJob(job_id, 'full');
            if (global_render_poll_timer) {
                clearInterval(global_render_poll_timer);
            }
            global_render_poll_timer = setInterval(pollUnfinishedRenderJobs, 5000);
            pollUnfinishedRenderJobs();
        }

        node_btn_reject.onclick = function() {
            // A stop is already in flight — the pending action owns the next step.
            if (global_pending_record_action) {
                return;
            }
            if (global_is_recording_flag === true) {
                // Rejected while the take is still recording: throw the clip
                // away and start the same line again straight away.
                appCoreLog("Recording rejected mid-take — retrying the same line.");
                global_pending_record_action = 'discard';
                executeStopRecording();
                return;
            }
            appCoreLog("Recording discarded by user.");
            resetTakeControlsToIdle();
            
            node_status_bar.textContent = "HARDWARE READY • MP4 STRICT MODE ENABLED";
            node_status_bar.className = "status-indicator-bar status-ready";
            // Express mode: a rejected take retries the line on its own.
            maybeAutoStartTake();
        };

        node_select_jump.onchange = function() {
            global_current_index = parseInt(this.value);
            synchronizeDisplay();
        };

        node_select_mic.onchange = function() {
            appCoreLog("Source changed. Refreshing hardware...");
            initializeCameraHardware();
        };

        /**
         * ==========================================
         * INITIAL SYSTEM BOOT
         * ==========================================
         */
        window.onload = async function() {
            appCoreLog("System Application Launch...");
            global_uploaded_takes = loadPersistedSet('uff_uploaded_takes');
            global_rendered_lessons = loadPersistedSet('uff_rendered_lessons');
            // Express mode survives a reload (the course switch reloads this
            // page), so an operator does not lose the mode mid-session.
            if (node_check_express) {
                node_check_express.checked = sessionStorage.getItem('uff_express_mode') === '1';
            }
            await loadCourseIndex();
            // Switching course reloads the studio so the CSV, the take list and
            // the render requests all belong to the same course.
            var picker = document.getElementById('dom-select-course');
            if (picker) {
                picker.addEventListener('change', function() {
                    sessionStorage.setItem('uff_course', picker.value);
                    var url = new URL(location.href);
                    url.searchParams.set('course', picker.value);
                    location.href = url.toString();
                });
            }
            loadScriptDataFromSheets();
        };

    </script>
