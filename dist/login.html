<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ultra Fast Fluency</title>
    <style>
        body {
            background-color: #0b1a2a;
            /* Match the theme's dark blue */
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            background-color: #1a3a5a;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .form-control {
            background-color: #2a4a6a;
            border: 1px solid #3a5a7a;
            color: white;
        }

        .form-control:focus {
            background-color: #2a4a6a;
            color: white;
            border-color: #4a6a8a;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .text-center a {
            color: #8bb4e7;
            text-decoration: none;
        }

        .text-center a:hover {
            color: white;
        }
    </style>
  <script type="module" crossorigin src="/assets/login-Bbwp-F_R.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-DfS4ul37.js">
  <link rel="modulepreload" crossorigin href="/assets/chunk-CeT-YOtV.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CWVAoYbt.js">
  <link rel="stylesheet" crossorigin href="/assets/bootstrap-CwawXFoc.css">
</head>

<body>

    <div class="auth-container">
        <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: yellow;">Login</h2>
        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
        </form>

        <div class="text-center mt-3">
            <p>Don't have an account? <a href="#" id="signup-link">Sign up</a></p>
            <p><a href="#" id="recover-link">Forgot password?</a></p>
        </div>
    </div>


</body>

</html>
