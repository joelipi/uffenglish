<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gemma 3 Nvidia Build Benchmark</title>
    <style>
        body {
            background: #0a0c10;
            color: #e2e8f0;
            font-family: monospace, sans-serif;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #a0aec0;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background: #111;
            color: #e2e8f0;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
        }

        #systemPrompt {
            height: 120px;
        }

        #customInput {
            height: 150px;
        }

        button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        button:disabled {
            background: #2d3748;
            cursor: not-allowed;
        }

        .counter-box {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #1a202c;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #2d3748;
            transition: color 0.3s, border-color 0.3s;
        }

        .counter-box.danger {
            color: #fc8181;
            border-color: #fc8181;
        }

        .status-bar {
            margin-top: 1rem;
            padding: 1rem;
            background: #1a202c;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #2d3748;
        }

        th {
            background: #1a202c;
            font-weight: bold;
        }

        .changed {
            color: #fbd38d;
        }

        .error {
            color: #fc8181;
        }

        .success {
            color: #68d391;
        }

        .sys-prompt-cell {
            font-size: 0.85em;
            color: #a0aec0;
            max-width: 250px;
        }

        /* Diff Styles */
        .diff-ins {
            background-color: rgba(72, 187, 120, 0.2);
            color: #68d391;
            text-decoration: none;
            border-radius: 3px;
            padding: 0 2px;
        }

        .diff-del {
            background-color: rgba(245, 101, 101, 0.2);
            color: #fc8181;
            text-decoration: line-through;
            border-radius: 3px;
            padding: 0 2px;
        }
    </style>
</head>

<body>
    <h2>🧪 Gemma 3 build.nvidia Benchmark</h2>
    <p>Test multiple system prompts against multiple sentences. The system will test every combination.</p>

    <div class="counter-box" id="callCounter">
        Total Scheduled API Calls: 0
    </div>

    <div class="input-group">
        <label for="systemPrompt">System Prompts (One per line)</label>
        <textarea id="systemPrompt"
            placeholder="You are a strict grammar correction tool...&#10;You are a casual editor, fix only major typos..."></textarea>
    </div>

    <div class="input-group">
        <label for="customInput">Test Sentences (One per line)</label>
        <textarea id="customInput" placeholder="He go to school every day.&#10;She don't like apples."></textarea>
    </div>

    <button id="runBtn">Run Sequential Benchmark</button>

    <div class="status-bar" id="statusBar" style="display: none;">
        <span id="progressText">Processing: 0 / 0</span>
        <span id="metricsText">Changed: 0 | Avg Time: 0ms</span>
    </div>

    <table id="resultsTable" style="display: none;">
        <thead>
            <tr>
                <th>System Prompt</th>
                <th>Input Sentence</th>
                <th>Output (Diff)</th>
                <th>Time (ms)</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <script>
        // ===== CONFIGURATION =====
        const aiEndpoint = 'https://nvidia-proxy.joel-1cb.workers.dev';
        const MODEL_NAME = "google/gemma-3-12b-it";

        // ===== DOM ELEMENTS =====
        const runBtn = document.getElementById('runBtn');
        const systemPromptInput = document.getElementById('systemPrompt');
        const customInput = document.getElementById('customInput');
        const callCounter = document.getElementById('callCounter');
        const statusBar = document.getElementById('statusBar');
        const progressText = document.getElementById('progressText');
        const metricsText = document.getElementById('metricsText');
        const resultsTable = document.getElementById('resultsTable');
        const resultsBody = document.getElementById('resultsBody');

        // ===== CALL COUNTER LOGIC =====
        function updateCounter() {
            const sysLines = systemPromptInput.value.split('\n').filter(s => s.trim().length > 0);
            const inputLines = customInput.value.split('\n').filter(s => s.trim().length > 0);
            const totalCalls = sysLines.length * inputLines.length;

            callCounter.textContent = `Total Scheduled API Calls: ${totalCalls}`;

            if (totalCalls > 40) {
                callCounter.classList.add('danger');
            } else {
                callCounter.classList.remove('danger');
            }
        }

        systemPromptInput.addEventListener('input', updateCounter);
        customInput.addEventListener('input', updateCounter);
        // Initialize counter on load
        updateCounter();

        // ===== DIFF GENERATOR =====
        function getDiff(oldStr, newStr) {
            const oldTokens = oldStr.match(/(\w+|\s+|[^\w\s]+)/g) || [];
            const newTokens = newStr.match(/(\w+|\s+|[^\w\s]+)/g) || [];
            const matrix = Array(oldTokens.length + 1).fill(null).map(() => Array(newTokens.length + 1).fill(0));

            for (let i = 1; i <= oldTokens.length; i++) {
                for (let j = 1; j <= newTokens.length; j++) {
                    if (oldTokens[i - 1] === newTokens[j - 1]) {
                        matrix[i][j] = matrix[i - 1][j - 1] + 1;
                    } else {
                        matrix[i][j] = Math.max(matrix[i - 1][j], matrix[i][j - 1]);
                    }
                }
            }

            let i = oldTokens.length, j = newTokens.length;
            const diff = [];
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && oldTokens[i - 1] === newTokens[j - 1]) {
                    diff.unshift({ type: 'equal', value: oldTokens[i - 1] });
                    i--; j--;
                } else if (j > 0 && (i === 0 || matrix[i][j - 1] >= matrix[i - 1][j])) {
                    diff.unshift({ type: 'insert', value: newTokens[j - 1] });
                    j--;
                } else if (i > 0 && (j === 0 || matrix[i][j - 1] < matrix[i - 1][j])) {
                    diff.unshift({ type: 'delete', value: oldTokens[i - 1] });
                    i--;
                }
            }

            return diff.map(part => {
                const val = part.value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                if (part.type === 'insert') return `<span class="diff-ins">${val}</span>`;
                if (part.type === 'delete') return `<span class="diff-del">${val}</span>`;
                return val;
            }).join('');
        }

        // ===== API CALL TO NVIDIA PROXY =====
        async function callNvidia(systemPrompt, userText) {
            const response = await fetch(aiEndpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userText }
                    ],
                    temperature: 0.1
                })
            });

            if (!response.ok) {
                const errorData = await response.text();
                throw new Error(`${response.status}: ${errorData}`);
            }

            const data = await response.json();
            let content = data.choices[0].message.content.trim();
            return content.replace(/^["'](.*)["']$/, '$1');
        }

        // ===== RUN SEQUENTIAL TESTS =====
        async function runSequentialTests() {
            const sysPrompts = systemPromptInput.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const testSet = customInput.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            if (sysPrompts.length === 0 || testSet.length === 0) {
                alert("Please enter at least one valid system prompt and test sentence.");
                return;
            }

            const totalCalls = sysPrompts.length * testSet.length;

            runBtn.disabled = true;
            resultsBody.innerHTML = '';
            resultsTable.style.display = 'table';
            statusBar.style.display = 'flex';

            let changesMade = 0;
            let totalTime = 0;
            let currentCall = 0;

            for (let s = 0; s < sysPrompts.length; s++) {
                const currentSysPrompt = sysPrompts[s];

                for (let i = 0; i < testSet.length; i++) {
                    currentCall++;
                    const input = testSet[i];
                    progressText.textContent = `Processing: ${currentCall} / ${totalCalls}`;

                    const start = performance.now();
                    let finalOutput = "";
                    let isError = false;

                    try {
                        finalOutput = await callNvidia(currentSysPrompt, input);
                    } catch (e) {
                        console.error(e);
                        finalOutput = `[ERROR: ${e.message}]`;
                        isError = true;
                    }

                    const end = performance.now();
                    const timeTaken = end - start;
                    totalTime += timeTaken;

                    const changed = !isError && (input.toLowerCase() !== finalOutput.toLowerCase());
                    if (changed) changesMade++;

                    appendRow(currentSysPrompt, input, finalOutput, timeTaken, changed, isError);
                    metricsText.textContent = `Changed: ${changesMade} | Avg Time: ${(totalTime / currentCall).toFixed(1)}ms`;
                }
            }

            runBtn.disabled = false;
        }

        function appendRow(sysPrompt, input, output, time, changed, isError) {
            const tr = document.createElement('tr');
            let displayOutput = isError ? `<span class="error">${output}</span>` : (changed ? getDiff(input, output) : output);

            tr.innerHTML = `
                <td class="sys-prompt-cell">${sysPrompt}</td>
                <td>${input}</td>
                <td>${displayOutput}</td>
                <td>${time.toFixed(1)}</td>
            `;
            resultsBody.appendChild(tr);
        }

        runBtn.onclick = runSequentialTests;
    </script>
</body>

</html>
