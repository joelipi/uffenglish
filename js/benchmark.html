<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GECToR REAL Benchmark (Worker)</title>
    <style>
        body {
            background: #0a0c10;
            color: #e2e8f0;
            font-family: monospace, sans-serif;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            color: #e2e8f0;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            margin-bottom: 1rem;
        }

        button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: #2d3748;
            cursor: not-allowed;
        }

        .status-bar {
            margin-top: 1rem;
            padding: 1rem;
            background: #1a202c;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #2d3748;
        }

        th {
            background: #1a202c;
            font-weight: bold;
        }

        .changed {
            color: #fbd38d;
        }

        .error {
            color: #fc8181;
        }

        .success {
            color: #68d391;
        }

        /* Diff Styles */
        .diff-ins {
            background-color: rgba(72, 187, 120, 0.2);
            color: #68d391;
            text-decoration: none;
            border-radius: 3px;
            padding: 0 2px;
        }

        .diff-del {
            background-color: rgba(245, 101, 101, 0.2);
            color: #fc8181;
            text-decoration: line-through;
            border-radius: 3px;
            padding: 0 2px;
        }
    </style>
</head>

<body>
    <h2>🧪 REAL GECToR Custom Benchmark</h2>
    <p>Paste your sentences below (one per line). The system will process them sequentially using your local GECToR
        worker.</p>
    <textarea id="customInput"
        placeholder="Enter sentences here...He go to school every day.She don't like apples."></textarea>
    <button id="runBtn" disabled>Loading Models...</button>
    <div class="status-bar" id="statusBar" style="display: none;"> <span id="progressText">Processing: 0 / 0</span>
        <span id="metricsText">Escalations: 0 | Avg Time: 0ms</span></div>
    <table id="resultsTable" style="display: none;">
        <thead>
            <tr>
                <th>Input</th>
                <th>Output (Diff)</th>
                <th>Confidence</th>
                <th>Time (ms)</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
    <script>
        // ===== DOM ELEMENTS =====
        const runBtn = document.getElementById('runBtn');
        const customInput = document.getElementById('customInput');
        const statusBar = document.getElementById('statusBar');
        const progressText = document.getElementById('progressText');
        const metricsText = document.getElementById('metricsText');
        const resultsTable = document.getElementById('resultsTable');
        const resultsBody = document.getElementById('resultsBody');

        let ready = false;

        // ===== CREATE WORKER =====
        const worker = new Worker('./nlp-worker-web.js', { type: 'module' });

        // ===== LOAD MODELS =====
        worker.postMessage({ action: 'LOAD_MODELS', id: 'load' });

        worker.onmessage = async (e) => {
            const { id, status, data } = e.data;
            if (id === 'load' && status === 'success') {
                ready = true;
                runBtn.textContent = "Run Sequential Benchmark";
                runBtn.disabled = false;
            }
        };

        // ===== DIFF GENERATOR (LCS Algorithm) =====
        function getDiff(oldStr, newStr) {
            // Split by words, whitespace, and punctuation for granular diffs
            const oldTokens = oldStr.match(/(\w+|\s+|[^\w\s]+)/g) || [];
            const newTokens = newStr.match(/(\w+|\s+|[^\w\s]+)/g) || [];

            const matrix = Array(oldTokens.length + 1).fill(null).map(() => Array(newTokens.length + 1).fill(0));

            for (let i = 1; i <= oldTokens.length; i++) {
                for (let j = 1; j <= newTokens.length; j++) {
                    if (oldTokens[i - 1] === newTokens[j - 1]) {
                        matrix[i][j] = matrix[i - 1][j - 1] + 1;
                    } else {
                        matrix[i][j] = Math.max(matrix[i - 1][j], matrix[i][j - 1]);
                    }
                }
            }

            let i = oldTokens.length;
            let j = newTokens.length;
            const diff = [];

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && oldTokens[i - 1] === newTokens[j - 1]) {
                    diff.unshift({ type: 'equal', value: oldTokens[i - 1] });
                    i--; j--;
                } else if (j > 0 && (i === 0 || matrix[i][j - 1] >= matrix[i - 1][j])) {
                    diff.unshift({ type: 'insert', value: newTokens[j - 1] });
                    j--;
                } else if (i > 0 && (j === 0 || matrix[i][j - 1] < matrix[i - 1][j])) {
                    diff.unshift({ type: 'delete', value: oldTokens[i - 1] });
                    i--;
                }
            }

            return diff.map(part => {
                // Escape HTML to prevent broken rendering
                const val = part.value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                if (part.type === 'insert') return `<span class="diff-ins">${val}</span>`;
                if (part.type === 'delete') return `<span class="diff-del">${val}</span>`;
                return val;
            }).join('');
        }

        // ===== RUN SEQUENTIAL TESTS =====
        async function runSequentialTests() {
            const rawText = customInput.value;
            const testSet = rawText.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            if (testSet.length === 0) {
                alert("Please enter at least one valid sentence.");
                return;
            }

            // UI Reset    
            runBtn.disabled = true;
            resultsBody.innerHTML = '';
            resultsTable.style.display = 'table';
            statusBar.style.display = 'flex';

            let results = [];
            let escalations = 0;
            let totalTime = 0;

            for (let i = 0; i < testSet.length; i++) {
                const input = testSet[i];
                progressText.textContent = `Processing: ${i + 1} / ${testSet.length}`;

                const start = performance.now();
                const result = await runSingle(input);
                const end = performance.now();

                const timeTaken = end - start;
                totalTime += timeTaken;

                const finalOutput = result.correction || input;
                const changed = input.toLowerCase() !== finalOutput.toLowerCase();
                const confidence = result.confidenceScore !== undefined ? result.confidenceScore : 1.0;
                const escalate = confidence < 0.75 || (!changed && result.correction !== null);

                if (escalate) escalations++;

                results.push({
                    input,
                    output: finalOutput,
                    confidence,
                    changed,
                    time: timeTaken
                });

                // Update UI dynamically        
                appendRow(input, finalOutput, confidence, timeTaken, changed, escalate);
                metricsText.textContent = `Escalations: ${escalations} | Avg Time: ${(totalTime / (i + 1)).toFixed(1)}ms`;
            }

            runBtn.disabled = false;
            console.table(results);
            window.__RESULTS__ = results;
        }

        // ===== APPEND ROW TO TABLE =====
        function appendRow(input, output, confidence, time, changed, escalate) {
            const tr = document.createElement('tr');

            const confClass = escalate ? 'error' : 'success';
            const displayOutput = changed ? getDiff(input, output) : output;

            tr.innerHTML = `        
        <td>${input}</td>        
        <td>${displayOutput}</td>        
        <td class="${confClass}">${(confidence * 100).toFixed(1)}%</td>        
        <td>${time.toFixed(1)}</td>    
    `;
            resultsBody.appendChild(tr);
        }

        // ===== RUN SINGLE REQUEST =====
        function runSingle(text) {
            return new Promise((resolve) => {
                const id = Math.random().toString(36);
                const handler = (e) => {
                    if (e.data.id === id) {
                        worker.removeEventListener('message', handler);
                        resolve(e.data.data);
                    }
                };
                worker.addEventListener('message', handler);
                worker.postMessage({
                    action: 'CHECK_GRAMMAR',
                    payload: { userInput: text },
                    id
                });
            });
        }

        // ===== EVENT LISTENERS =====
        runBtn.onclick = () => {
            if (ready) runSequentialTests();
        };
    </script>
    <script>
        // <![CDATA[  <-- For SVG support
        if ('WebSocket' in window) {
            (function () {
                function refreshCSS() {
                    var sheets = [].slice.call(document.getElementsByTagName("link"));
                    var head = document.getElementsByTagName("head")[0];
                    for (var i = 0; i < sheets.length; ++i) {
                        var elem = sheets[i];
                        var parent = elem.parentElement || head;
                        parent.removeChild(elem);
                        var rel = elem.rel;
                        if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
                            var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
                            elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
                        }
                        parent.appendChild(elem);
                    }
                }
                var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
                var address = protocol + window.location.host + window.location.pathname + '/ws';
                var socket = new WebSocket(address);
                socket.onmessage = function (msg) {
                    if (msg.data == 'reload') window.location.reload();
                    else if (msg.data == 'refreshcss') refreshCSS();
                };
                if (sessionStorage && !sessionStorage.getItem('IsThisFirstTime_Log_From_LiveServer')) {
                    console.log('Live reload enabled.');
                    sessionStorage.setItem('IsThisFirstTime_Log_From_LiveServer', true);
                }
            })();
        }
        else {
            console.error('Upgrade your browser. This Browser is NOT supported WebSocket for Live-Reloading.');
        }
        // ]]>
    </script>
</body>

</html>
