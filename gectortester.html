<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GECToR Browser Benchmark</title>

<style>
body {
    background:#0a0c10;
    color:#e2e8f0;
    font-family:monospace;
    padding:2rem;
}
textarea {
    width:100%;
    background:#1e1f24;
    color:#e2e8f0;
    border:1px solid #4a5568;
    border-radius:12px;
    padding:0.8rem;
}
button {
    background:#2d3748;
    color:white;
    border:none;
    padding:0.6rem 1rem;
    margin-top:1rem;
    border-radius:20px;
    cursor:pointer;
}
.log {
    background:#111;
    padding:1rem;
    border-radius:12px;
    margin-top:1rem;
    max-height:500px;
    overflow:auto;
    font-size:0.85rem;
}
.error { color:#ff8a8a; }
.success { color:#8aff8a; }
</style>
</head>

<body>

<h2>🧪 GECToR In-Browser Benchmark</h2>

<textarea id="inputText">He go to school every day.</textarea>
<button id="checkBtn" disabled>⏳ Loading model…</button>

<div id="logPanel" class="log"></div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
import Tokenizer from 'https://cdn.skypack.dev/wink-tokenizer';

// --- ENV CONFIG ---
env.allowLocalModels = false;
env.useBrowserCache = true;
env.backends.onnx.wasm.numThreads = 1;
env.backends.onnx.wasm.simd = false;
env.backends.onnx.wasm.proxy = false;
env.backends.onnx.wasm.wasmPaths =
'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0-dev.20241016-2b8fc5529b/dist/';

// --- GLOBALS ---
const tokenizer = new Tokenizer();
let gectorPipeline, id2label, verbFormVocab;

const logDiv = document.getElementById('logPanel');
const btn = document.getElementById('checkBtn');
const input = document.getElementById('inputText');

// --- LOG ---
function log(msg, err=false) {
    const d = document.createElement('div');
    d.textContent = msg;
    d.className = err ? 'error' : 'success';
    logDiv.appendChild(d);
    console.log(msg);
    d.scrollIntoView();
}

// --- LOAD ---
async function load() {
    log("📥 Loading model...");

    gectorPipeline = await pipeline(
        'token-classification',
        'Meyssa/gector-base-2020',
        {
            device:'wasm',
            dtype:'q8',
            progress_callback:x=>{
                if(x.status==='progress'){
                    log(`📦 ${Math.round(x.loaded/x.total*100)}%`);
                }
            }
        }
    );

    id2label = await (await fetch(
        'https://huggingface.co/Meyssa/gector-base-2020/resolve/main/id2label.json'
    )).json();

    const verbText = await (await fetch(
        'https://raw.githubusercontent.com/grammarly/gector/master/data/verb-form-vocab.txt'
    )).text();

    verbFormVocab = parseVerbVocab(verbText);

    log("✅ Ready");
    btn.disabled = false;
    btn.textContent = "Run Benchmark";
}

// --- VERB VOCAB ---
function parseVerbVocab(text){
    const dict = {};
    for(const line of text.trim().split('\n')){
        const [words,tags]=line.split(':');
        if(!words||!tags) continue;
        const [src,tgt]=words.split('_');
        const [f,t]=tags.split('_');
        dict[`${src}_${f}_${t}`]=tgt;
    }
    return dict;
}

// --- TRANSFORM ---
function transform(word,t){
    switch(t){
        case 'LOWER': return word.toLowerCase();
        case 'UPPER': return word.toUpperCase();
        case 'CAPITALIZE': return word[0].toUpperCase()+word.slice(1);
        default:
            return verbFormVocab[`${word}_${t}`] || word;
    }
}

// --- CORE ---
async function correct(text,{maxIter=3}={}){

    let cur = text;
    let steps = [];

    const t0 = performance.now();

    for(let i=0;i<maxIter;i++){

        const words = tokenizer.tokenize(cur)
            .filter(t=>t.tag!=='space')
            .map(t=>t.value);

        const input = ['$START',...words];

        const tInferStart = performance.now();

        let preds = await gectorPipeline(input.join(' '), {
            aggregation_strategy:'first'
        });

        const tInferEnd = performance.now();

        preds = preds.filter(p =>
            !['<s>','</s>','<pad>'].includes(p.word)
        );

        let aligned = [];
        let idx=0;

        for(const w of input){
            let built='', first=null;

            while(idx<preds.length){
                let sub=preds[idx].word.replace(/^Ġ/,'');
                if(!first) first=preds[idx];
                built+=sub;
                idx++;
                if(built.length>=w.length) break;
            }

            let ent = first?.entity || '$KEEP';
            if(ent.startsWith('LABEL_')){
                ent = id2label[ent.replace('LABEL_','')] || ent;
            }

            aligned.push({
                word:w,
                entity:ent,
                score:first?.score ?? 1
            });
        }

        let out=[];
        let changes=0;

        for(let j=0;j<aligned.length;j++){
            let {word,entity}=aligned[j];
            if(j===0) continue;

            if(entity==='$KEEP'){ out.push(word); continue; }

            changes++;

            if(entity.startsWith('$REPLACE_'))
                out.push(entity.slice(9));

            else if(entity==='$DELETE'){}

            else if(entity.startsWith('$APPEND_')){
                out.push(word);
                out.push(entity.slice(8));
            }

            else if(entity.startsWith('$TRANSFORM_')){
                out.push(transform(word,entity.slice(11)));
            }

            else out.push(word);
        }

        const next = out.join(' ');

        steps.push({
            iter:i+1,
            text:next,
            changes,
            inferMs: (tInferEnd - tInferStart).toFixed(1),
            tokens:aligned
        });

        if(next===cur || changes===0) break;
        cur = next;
    }

    const t1 = performance.now();

    const tokens = steps.at(-1)?.tokens || [];
    const confidence = tokens.reduce((a,b)=>a+b.score,0)/(tokens.length||1);

    return {
        original:text,
        corrected:cur,
        confidence,
        totalMs:(t1-t0).toFixed(1),
        steps,
        tokens
    };
}

// --- CLICK ---
btn.addEventListener('click', async ()=>{

    const text = input.value.trim();
    if(!text) return;

    log(`\n🔍 Input: "${text}"`);

    const res = await correct(text);

    log(`✅ Output: "${res.corrected}"`);
    log(`📊 Confidence: ${(res.confidence*100).toFixed(2)}%`);
    log(`⏱ Total: ${res.totalMs} ms`);

    res.steps.forEach(s=>{
        log(`  Iter ${s.iter}: ${s.text} | Δ=${s.changes} | ${s.inferMs}ms`);
    });

    log("🧠 Token details:");
    res.tokens.forEach(t=>{
        log(`  ${t.word} → ${t.entity} (${(t.score*100).toFixed(1)}%)`);
    });

});

// --- START ---
load();

</script>
</body>
</html>
