<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ultra Fast Fluency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b1a2a;
            /* Match the theme's dark blue */
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            background-color: #1a3a5a;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .form-control {
            background-color: #2a4a6a;
            border: 1px solid #3a5a7a;
            color: white;
        }

        .form-control:focus {
            background-color: #2a4a6a;
            color: white;
            border-color: #4a6a8a;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .text-center a {
            color: #8bb4e7;
            text-decoration: none;
        }

        .text-center a:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: yellow;">Login</h2>
        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
        </form>

        <div class="text-center mt-3">
            <p>Don't have an account? <a href="#" id="signup-link">Sign up</a></p>
            <p><a href="#" id="recover-link">Forgot password?</a></p>
        </div>
    </div>

    <script type="module">
        import { account } from './js/modules/appwrite.js';
        import { invalidateUserAndAuthCache } from './js/modules/api.js'; // 🚀 Added import

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect') || 'lesson.html';

            const redirectQuery = urlParams.get('redirect') ? `?redirect=${encodeURIComponent(urlParams.get('redirect'))}` : '';
            document.getElementById('signup-link').href = `signup.html${redirectQuery}`;
            document.getElementById('recover-link').href = `recover-password.html${redirectQuery}`;

            const loginForm = document.getElementById('login-form');
            const errorMsg = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.classList.add('d-none');
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    // Check if a session already exists
                    try {
                        await account.get();
                        window.location.href = redirectUrl;
                        return;
                    } catch (e) {
                        // Not logged in, proceed to login
                    }

                    await account.createEmailPasswordSession(email, password);

                    invalidateUserAndAuthCache(); // 🚀 Bust the cache!

                    window.location.href = redirectUrl;
                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('d-none');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log In';
                }
            });
        });
    </script>

</body>

</html>
