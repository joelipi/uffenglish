<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Ultra Fast Fluency</title>
    <link href="./node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b1a2a;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .auth-container {
            background-color: #1a3a5a;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }

        .form-control,
        .form-select {
            background-color: #2a4a6a;
            border: 1px solid #3a5a7a;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #2a4a6a;
            color: white;
            border-color: #4a6a8a;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }

        /* Ensure dropdown options are visible on some browsers */
        option {
            background-color: #2a4a6a;
            color: white;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .text-center a {
            color: #8bb4e7;
            text-decoration: none;
        }

        .text-center a:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: yellow;">Sign Up</h2>
        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <form id="signup-form">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="first-name" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="first-name" required>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="last-name" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="last-name" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password (min 8 chars)</label>
                <input type="password" class="form-control" id="password" required minlength="8">
            </div>

            <div class="row mb-3">
                <div class="col-6">
                    <label for="nativeLanguage" class="form-label">Native Language</label>
                    <select class="form-select" id="nativeLanguage" required>
                        <option value="" selected disabled>Select...</option>
                        <option value="EN">English</option>
                        <option value="ES">Español (Spanish)</option>
                        <option value="PT">Português (Portuguese)</option>
                        <option value="FR">Français (French)</option>
                        <option value="DE">Deutsch (German)</option>
                        <option value="KO">한국어 (Korean)</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="englishLevel" class="form-label">English Level</label>
                    <select class="form-select" id="englishLevel" required>
                        <option value="" selected disabled>Select...</option>
                        <option value="A0">A0 (Absolute Beginner)</option>
                        <option value="A1">A1 (Beginner)</option>
                        <option value="A2">A2 (Elementary)</option>
                        <option value="B1">B1 (Intermediate)</option>
                        <option value="B2">B2 (Upper Intermediate)</option>
                        <option value="C1">C1 (Advanced)</option>
                        <option value="C2">C2 (Proficient)</option>
                        <option value="Native">Native</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="signup-btn">Sign Up</button>
        </form>

        <div class="text-center mt-3">
            <p>Already have an account? <a href="#" id="login-link">Log in</a></p>
        </div>
    </div>

    <script type="module">
        import { account, tablesDB, ID, APPWRITE_CONFIG } from './js/modules/appwrite.js';
        import { invalidateUserAndAuthCache } from './js/modules/api.js'; // 🚀 Added import

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect') || 'homescreen.html';

            const redirectQuery = urlParams.get('redirect') ? `?redirect=${encodeURIComponent(urlParams.get('redirect'))}` : '';
            document.getElementById('login-link').href = `login.html${redirectQuery}`;

            const signupForm = document.getElementById('signup-form');
            const errorMsg = document.getElementById('error-message');
            const signupBtn = document.getElementById('signup-btn');

            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.classList.add('d-none');
                signupBtn.disabled = true;
                signupBtn.textContent = 'Creating account...';

                const firstName = document.getElementById('first-name').value.trim();
                const lastName = document.getElementById('last-name').value.trim();
                const fullName = `${firstName} ${lastName}`;

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const nativeLanguage = document.getElementById('nativeLanguage').value;
                const englishLevel = document.getElementById('englishLevel').value;

                try {
                    const user = await account.create(ID.unique(), email, password, fullName);

                    // 🔑 Create a session immediately — without this, the next call runs as a guest
                    await account.createEmailPasswordSession(email, password);

                    signupBtn.textContent = 'Setting up profile...';
                    await tablesDB.createRow({
                        databaseId: APPWRITE_CONFIG.DATABASE_ID,
                        tableId: APPWRITE_CONFIG.USER_PROFILES_TABLE_ID,
                        rowId: user.$id,
                        data: {
                            email: email,
                            firstName: firstName,
                            lastName: lastName,
                            joinDate: new Date().toISOString(),
                            accountStatus: 'active',
                            native_language: nativeLanguage,
                            english_level: englishLevel,
                            completed_dates: []
                        }
                    });

                    invalidateUserAndAuthCache();
                    localStorage.setItem('wpLoggedIn', 'true');
                    window.location.href = redirectUrl;

                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('d-none');
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'Sign Up';
                }
            });
        });
    </script>

</body>

</html>
