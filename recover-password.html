<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password - Ultra Fast Fluency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b1a2a;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            background-color: #1a3a5a;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            background-color: #2a4a6a;
            border: 1px solid #3a5a7a;
            color: white;
        }
        .form-control:focus {
            background-color: #2a4a6a;
            color: white;
            border-color: #4a6a8a;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .text-center a {
            color: #8bb4e7;
            text-decoration: none;
        }
        .text-center a:hover {
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: yellow;">Recover Password</h2>
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
    <div id="success-message" class="alert alert-success d-none" role="alert">Recovery email sent. Check your inbox.</div>

    <p class="text-center text-light mb-4">Enter your email address to receive a password reset link.</p>

    <form id="recover-form">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <button type="submit" class="btn btn-primary" id="recover-btn">Send Recovery Email</button>
    </form>

    <div class="text-center mt-3">
        <p><a href="#" id="login-link">Back to login</a></p>
    </div>
</div>

<script type="module">
    import { account } from './js/modules/appwrite.js';

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectQuery = urlParams.get('redirect') ? `?redirect=${encodeURIComponent(urlParams.get('redirect'))}` : '';
        document.getElementById('login-link').href = `login.html${redirectQuery}`;

        const recoverForm = document.getElementById('recover-form');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const recoverBtn = document.getElementById('recover-btn');

        recoverForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('d-none');
            successMsg.classList.add('d-none');
            recoverBtn.disabled = true;
            recoverBtn.textContent = 'Sending...';

            const email = document.getElementById('email').value;

            try {
                // The URL the user will be redirected to from their email
                // Note: Make sure the URL domain matches your Appwrite project configuration
                const currentUrl = new URL(window.location.href);
                const resetUrl = `${currentUrl.origin}/reset-password.html`;

                await account.createRecovery(email, resetUrl);

                successMsg.classList.remove('d-none');
                recoverBtn.textContent = 'Sent';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('d-none');
                recoverBtn.disabled = false;
                recoverBtn.textContent = 'Send Recovery Email';
            }
        });
    });
</script>

</body>
</html>
