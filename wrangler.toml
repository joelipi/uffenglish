name = "uffenglish"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-10"

# R2 bucket for per-segment webcam video uploads (UGC practice-prompt library).
# Lifecycle: auto-delete objects under `videos/` 48 hours (2 days) after upload.
[[r2_buckets]]
binding = "UFF_R2"
bucket_name = "uff"

  [[r2_buckets.lifecycle]]
  id = "expire-videos-48h"
  conditions = { prefix = "videos/" }
  delete_within_days = 2

# Appwrite config (NOT used by the current Function — it makes no Appwrite
# calls — but kept for future Functions and parity with the SPA's runtime
# config). APPWRITE_API_KEY is no longer required; if set via
# `wrangler secret put APPWRITE_API_KEY` it is simply ignored.
[vars]
APPWRITE_ENDPOINT = "https://nyc.cloud.appwrite.io/v1"
APPWRITE_PROJECT = "69e6faf4001ff72b2ac3"
APPWRITE_DATABASE = "69e6fc160026cb28cf02"
APPWRITE_USER_PROFILES_TABLE = "userprofilestable"
