name = "uffenglish"
pages_build_output_dir = "dist"
compatibility_date = "2026-03-17"

[[r2_buckets]]
binding = "UFF_R2"
bucket_name = "uff"
# NOTE: R2 lifecycle (48h TTL for videos/ prefix) must be set via the
# Cloudflare dashboard or `wrangler r2 bucket lifecycle put uff` — the
# `r2_buckets.lifecycle` key is NOT valid in wrangler.toml for Pages.

# Supabase config (public values, also in .env for SPA)
# SUPABASE_ANON_KEY is NOT set here — it lives in the Cloudflare Pages dashboard
# (Settings → Variables) to avoid "Binding already in use" on deploy. The
# dashboard var is now optional: /api/upload-segment falls back to the
# publishable defaults in functions/api/upload-segment.js.
[vars]
SUPABASE_URL = "https://jbrbmbmupjfangqvaevx.supabase.co"
