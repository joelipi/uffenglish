name = "uffenglish"
pages_build_output_dir = "dist"
compatibility_date = "2026-03-17"

[[r2_buckets]]
binding = "UFF_R2"
bucket_name = "uff"
# NOTE: R2 lifecycle (48h TTL for videos/ prefix) must be set via the
# Cloudflare dashboard or `wrangler r2 bucket lifecycle put uff` — the
# `r2_buckets.lifecycle` key is NOT valid in wrangler.toml for Pages.

# Private pipeline bucket (story 041): raw takes, raw/status markers and
# pipeline-assets inputs. It deliberately has NO public custom domain and no
# r2.dev subdomain, so r2.ultrafastfluency.com (attached to `uff` only) cannot
# serve an unpublished take. Do NOT attach r2.ultrafastfluency.com (or any
# public domain) to this bucket. Lifecycle for raw/ is set out of band:
#   npx wrangler r2 bucket lifecycle add uff-private raw-takes-7d \
#     --prefix "raw/" --expire-days 7
# The videos/ 48h rule stays on the public `uff` bucket.
[[r2_buckets]]
binding = "PIPELINE_R2"
bucket_name = "uff-private"

# Supabase config (public values, also in .env for SPA)
# SUPABASE_ANON_KEY is NOT set here — it lives in the Cloudflare Pages dashboard
# (Settings → Variables) to avoid "Binding already in use" on deploy. The
# dashboard var is now optional: /api/upload-segment falls back to the
# publishable defaults in functions/api/upload-segment.js.
[vars]
SUPABASE_URL = "https://jbrbmbmupjfangqvaevx.supabase.co"
# Public Modal trigger URL used by functions/api/pipeline/render.js. It must live
# here, not only in the dashboard: `wrangler pages deploy` applies [vars] and
# drops dashboard plain-text vars not listed here (dashboard *secrets* survive).
MODAL_RENDER_URL = "https://joel-56422--uff-lesson-video-trigger.modal.run"
# Welcome-email sender/fallback origin for functions/api/welcome-email.js.
# ZOHO_CPAAS_API_KEY (the actual secret) lives in the Pages dashboard.
EMAIL_FROM = "Ultrafast Fluency <welcome@ultrafastfluency.com>"
SITE_URL = "https://ultrafastfluency.com"
# Web Push (story 063). The VAPID PUBLIC key is public by design — it ships in
# the client bundle as DEFAULT_VAPID_PUBLIC_KEY in
# src/modules/notifications/push-config.js and is sent to the browser push
# service — repeated here so the sender Function has an explicit runtime value.
# Rotating a pair means updating this, push-config.js and the VAPID_PRIVATE_KEY
# secret together (a mismatch makes every send fail).
VAPID_PUBLIC_KEY = "BPACBWNJq2D9dZPrwyBVwEO0A3D3KfVCCSHaOjx_k1jy1SYedCBxMiebBvwieyjH4VYZx2-fr8sxRDvLPIC7aVM"
VAPID_SUBJECT = "mailto:welcome@ultrafastfluency.com"
# Comma-separated frontend hostnames whose Turnstile tokens
# /api/turnstile-verify accepts (functions/api/turnstile-verify.js). Non-secret.
# Deliberately has NO localhost/127.0.0.1: the Turnstile widget is registered for
# those hostnames, but a production backend must not trust a token solved there.
# Keep this list and the widget's domain list in sync — siteverify returns the
# hostname the challenge was actually solved on.
TURNSTILE_HOSTNAMES = "ultrafastfluency.com,www.ultrafastfluency.com,cogdex.com,uffenglish.pages.dev,s.ultrafastfluency.com,go.ultrafastfluency.com"
