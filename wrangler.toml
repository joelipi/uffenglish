name = "uffenglish"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-10"

# R2 bucket for per-segment webcam video uploads (UGC practice-prompt library).
# Lifecycle: auto-delete objects under `videos/` 48 hours (2 days) after upload.
[[r2_buckets]]
binding = "UFF_R2"
bucket_name = "uff"

  [[r2_buckets.lifecycle]]
  id = "expire-videos-48h"
  conditions = { prefix = "videos/" }
  delete_within_days = 2

# Appwrite config (used by functions/api/upload-segment.js).
# APPWRITE_API_KEY (server-side API key with read access to user profiles)
# is set via `wrangler secret put APPWRITE_API_KEY` and NOT committed.
[vars]
APPWRITE_ENDPOINT = "https://cloud.appwrite.io/v1"
APPWRITE_PROJECT = "your-project-id"
APPWRITE_DATABASE = "your-database-id"
APPWRITE_USER_PROFILES_TABLE = "userprofilestable"
