<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Chat Bubbles</title>
    <!-- Include Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #e5ddd5; padding: 20px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="chat-container">
        <!-- AI Message -->
        <div class='chat-message-wrapper ai-message-wrapper'>
            <img src='assets/img/teacherprofile.png' alt='AI' class='chat-avatar-inline' />
            <div class='chat-bubble chat-msg'>
                <div class="chat-bubble-header" style="font-weight: bold; font-size: 0.85em; color: #128C7E; margin-bottom: 4px;">~ Grammar Bot</div>
                Here is some grammar feedback to help you improve. Notice the sentence structure.
            </div>
        </div>

        <!-- User Message -->
        <div class='chat-message-wrapper user-message-wrapper' style='margin-top: 20px;'>
            <img src='assets/img/teacherprofile.png' alt='User' class='chat-avatar-inline' />
            <div class='userResponse chat-bubble-sent chat-msg'>
                <div class='chat-bubble-header' style='font-weight: bold; font-size: 0.85em; color: #dcf8c6; filter: invert(0.2); margin-bottom: 4px;'>~ John</div>
                This is my test response. Did I do well?
            </div>
        </div>
    </div>
</body>
</html>
