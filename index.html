<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UFF English</title>

    <!-- Installable app (PWA). The `<link rel="manifest">` and the service
         worker registration script are injected into the built index.html by
         vite-plugin-pwa from scripts/lib/pwa-manifest.js (dev intentionally
         serves no manifest; check PWA behaviour with `npm run preview`). The
         icon and theme tags below are the static head links the generator
         prints from `npm run pwa:assets` (pwa-assets.config.js) — it writes the
         files, it does not edit this document. -->
    <meta name="theme-color" content="#0b1a2a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="UFF">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">

    <!-- Google Fonts — the brand kit (Inter body / Titillium Web headings + the
         :lang() override faces), loaded NON-BLOCKING: a plain
         `<link rel="stylesheet">` here stalls rendering AND module-script
         execution, so the entry script at the end of <body> would not run until
         the font CSS resolved — and with it the whole boot
         chain that starts the Whisper model download (speech.js arms
         `preloadWhisperEngine()` at module scope, which spawns the worker that
         fetches the ONNX graphs). Keeping this non-render-blocking keeps the
         critical inline preloader CSS above and starts the model fetch as
         early as possible. `display=swap` means text still renders in the
         fallback stack while the webfonts arrive, so nothing is invisible.

         `preconnect` opens the TCP+TLS connection to both font origins while
         the parser is still walking the head, so the stylesheet costs no extra
         round-trip. `crossorigin` is on gstatic only: the .woff2 files are
         CORS fetches, the css2 stylesheet is not.

         The plain `<link rel="stylesheet">` form — the one to use when this
         markup is copied into a page that does not boot a speech engine — is
         `googleFontsUrl()` in src/modules/theme/brand-fonts.js, and the href
         below is asserted against it by brand-fonts-wiring.test.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700&family=Inter:wght@400;500;600&family=Khand:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+TC:wght@700&family=Titillium+Web:ital,wght@0,700;0,900;1,700&family=Zen+Kaku+Gothic+New:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700&family=Inter:wght@400;500;600&family=Khand:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+TC:wght@700&family=Titillium+Web:ital,wght@0,700;0,900;1,700&family=Zen+Kaku+Gothic+New:wght@700&display=swap"></noscript>

    <!-- Whisper models (ONNX graphs + the sherpa-onnx runtime) are the heaviest
         bytes the app fetches and they come from a different origin than the
         shell, so nothing warms that connection by default. speech.js starts
         the model download at module scope, which is late in the boot chain;
         preconnecting here buys back the TCP+TLS round-trip that would
         otherwise be serialized in front of it. `crossorigin` because the
         model files are fetched with CORS. Kept in step with the workers'
         literals by whisper-model-origin.test.js. -->
    <link rel="preconnect" href="https://r2.ultrafastfluency.com" crossorigin>

    <!-- Preloader reveal gate.
         The brand fonts load non-render-blocking (see above) so the Whisper
         model download can start as early as possible — which means the first
         paint *can* land before the webfonts. Rather than let the user see the
         fallback stack and then a swap, hold the existing preloader cover until
         the faces visible at first paint have resolved, and reveal from there.

         Hard-capped at CAP_MS so a slow or blocked font CDN can never hold the
         app hostage: past the cap the app shows in whatever font stack it has,
         which is the behaviour we had before. -->
    <script>
        (function () {
            var MIN_DISPLAY_MS = 2000;
            var CAP_MS = 2000;
            // Must match the `preloaderImageOut` duration in the stylesheet
            // below — it is the grace period before the overlay is hidden, so a
            // mismatch means the timeout either fires mid-fade or lingers.
            var EXIT_FADE_MS = 250;
            // Must match `preloaderImageIn` in the stylesheet below. The exit
            // waits for the entry animation to finish before starting (see
            // reveal()), so the hideCover failsafe has to cover both.
            var ENTRY_FADE_MS = 350;
            var POLL_MS = 20;
            var POLL_TRIES = 150;           // 150 * 20ms = 3s of polling, then give up
            // Passing a text argument is what keeps this to the `latin` subset.
            // Without it document.fonts.load() pulls EVERY unicode-range slice
            // Google serves for the family (21 for Inter alone), which on a
            // phone is the opposite of what this gate is for.
            var LATIN_SAMPLE = 'Aa';
            // Only the faces on screen at first paint. h1/h2/h3 are italic;
            // Titillium Web has no italic 900, so h1 slants the 900 upright
            // face and both of those are listed. The :lang() override faces
            // (Zen Kaku Gothic New, Noto Sans SC/TC, Khand, Hind Siliguri) are
            // deliberately NOT forced — they are only needed once such text is
            // actually on screen, and pre-pulling their CJK slices would cost
            // megabytes of everyone's first load.
            var FIRST_PAINT_FACES = [
                '400 1rem Inter',
                '600 1rem Inter',
                'italic 700 1rem "Titillium Web"',
                '900 1rem "Titillium Web"'
            ];

            function reveal() {
                var html = document.documentElement;
                // Idempotent: the cap and the faces race can both land here.
                if (html.classList.contains('app-revealing')) return;

                var image = document.querySelector('.appLoadingImage');
                var hidden = false;
                function hideCover() {
                    if (hidden) return;
                    hidden = true;
                    html.classList.add('app-ready');
                }

                if (!image) { hideCover(); return; }

                function startExit() {
                    html.classList.add('app-revealing');
                }

                // Hand off cleanly from the entry animation. If the reveal lands
                // while `preloaderImageIn` is still running, switching straight
                // to the exit animation restarts it at opacity 1 and the image
                // visibly jumps up before fading. Letting the entry finish
                // costs at most its 350ms and starts the exit from full opacity.
                var entry = image.getAnimations().filter(function (a) {
                    return a.animationName === 'preloaderImageIn';
                })[0];
                if (entry && entry.playState === 'running') {
                    entry.addEventListener('finish', startExit, { once: true });
                } else {
                    startExit();
                }

                // Let the exit fade actually play before the overlay is taken
                // out of the tree — display:none is not animatable, so doing it
                // in the same frame would pop the image away at full opacity.
                image.addEventListener('animationend', function (event) {
                    if (event.animationName === 'preloaderImageOut') hideCover();
                });
                // …and if that event never arrives (animation cancelled, a
                // future CSS change), do not keep the user waiting. Generous
                // enough to cover the entry handoff above.
                setTimeout(hideCover, EXIT_FADE_MS + 400 + ENTRY_FADE_MS);
            }

            try {
                if (!document.fonts || !document.fonts.load) {
                    // No Font Loading API: nothing to wait for, but still go
                    // through the same path so the cover lifts only once React
                    // has painted.
                    whenAppRendered().then(reveal, reveal);
                    return;
                }

            // The font stylesheet is itself non-blocking, so at this point in
            // the parse no @font-face rule for the kit exists yet and
            // document.fonts.load() would match nothing and resolve instantly —
            // which would lift the preloader before the fonts had even started.
            // Wait for the faces to be registered first.
            function whenFacesRegistered() {
                return new Promise(function (resolve) {
                    var tries = 0;
                    (function poll() {
                        var registered = false;
                        for (var i = 0; i < document.fonts.length; i++) {
                            if (/Inter|Titillium/.test(document.fonts[i].family)) {
                                registered = true;
                                break;
                            }
                        }
                        if (registered || tries++ >= POLL_TRIES) { resolve(); return; }
                        setTimeout(poll, POLL_MS);
                    })();
                });
            }

            function loadFirstPaintFaces() {
                return Promise.all(FIRST_PAINT_FACES.map(function (face) {
                    return document.fonts.load(face, LATIN_SAMPLE).catch(function () { return null; });
                }));
            }

            // React painting into #root, so lifting the cover never exposes an
            // empty frame between the preloader gradient and the app.
            function whenAppRendered() {
                return new Promise(function (resolve) {
                    var tries = 0;
                    (function poll() {
                        var root = document.getElementById('root');
                        if ((root && root.childElementCount > 0) || tries++ >= POLL_TRIES) {
                            resolve();
                            return;
                        }
                        setTimeout(poll, POLL_MS);
                    })();
                });
            }

            var minDisplay = new Promise(function (resolve) { setTimeout(resolve, MIN_DISPLAY_MS); });
            // MIN_DISPLAY stops the cover from vanishing after ~300ms on a warm
            // cache (which is what made the preloader image effectively invisible);
            // CAP_MS keeps it from holding longer than 2s when fonts are slow.
            var cap = new Promise(function (resolve) { setTimeout(resolve, CAP_MS); });
                Promise.race([
                    Promise.all([whenFacesRegistered().then(loadFirstPaintFaces), whenAppRendered(), minDisplay]),
                    cap
                ]).then(reveal, reveal);
            } catch (error) {
                // A synchronous failure while wiring the gate up must not cost
                // the user the 4s CSS failsafe — lift the cover now.
                reveal();
            }
        })();
    </script>

    <!-- Critical inline styles (preloader — must be available before external CSS loads) -->
    <style>
        /* Critical Error State */
        #criticalErrorContainer {
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.85);
            z-index: 10006;
            position: absolute;
            top: 0;
            left: 0;
        }

        #micStatusText {
            color: white !important;
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000,
                0 0 15px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 0, 0, 1) !important;
            z-index: 10007 !important;
            pointer-events: none;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        /* === PRELOADER (kept inline — must render before external CSS loads) === */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Match the Preloader gradient so any gap between the HTML preloader
               hiding and the React Preloader painting shows blue, not black. */
            background: linear-gradient(135deg, #3a8fd5 0%, #00c0d8 100%);
            overflow: hidden;
            /* Same stack as --font-body in src/assets/css/app.css. Repeated as a
               literal because this block must paint before the external
               stylesheet (and its :root variables) arrive — see
               src/modules/theme/brand-fonts.js. */
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            /* Match Preloader gradient — prevents black flash between the HTML
               preloader hiding and React painting. Overridden to #000 by the
               .app-container rule in app.css once the external stylesheet loads. */
            background: linear-gradient(135deg, #3a8fd5 0%, #00c0d8 100%);
        }

        #appLoadingImageDiv {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3a8fd5 0%, #00c0d8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            /* Failsafe only: the reveal script below lifts this on the app-ready
               class as soon as the first-paint webfaces resolve. If that script
               never runs (JS error, blocked inline script) this animation still
               clears the overlay at 4s, so a script failure can never leave the
               app stranded behind an image. `visibility` is animatable, so a
               0s step at a delay is enough — no transition needed. */
            animation: preloaderFailsafe 0s linear 4s forwards;
        }

        @keyframes preloaderFailsafe {
            to { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        /* The preloader covers the first paint and lifts only once the body
           face and the display faces have resolved (see the reveal script),
           so the app is never shown rendering in the fallback stack and then
           swapping to the webfont. This replaces the old
           `#root:not(:empty) ~ #appLoadingImageDiv` rule, which lifted on React
           mounting regardless of whether the fonts had arrived. */
        .app-ready #appLoadingImageDiv {
            display: none !important;
        }

        .appLoadingImage {
            /* Giant: fill almost the whole cover so the UFF mark reads large
               rather than as a sparse ~2% mark at 80vw. The cover itself
               already holds 2s (see MIN_DISPLAY_MS above), so enlarging this
               only helps — nothing downstream depends on its box size. */
            width: 95vw;
            height: 95vh;
            max-width: 95vw;
            max-height: 95vh;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.55));
            /* The PNG has a transparent background — the gradient on
               #appLoadingImageDiv above is what shows through it, so this box
               is the thing that is transformed, never the gradient. */
            background: url('/assets/img/u-f-f.png') no-repeat center center;
            background-size: contain;
            /* Two phases, not one fixed-length timeline. The gate below decides
               when to reveal based on when the fonts and React are ready, so a
               single 2s animation would usually be cut off by
               `display: none` mid-hold — the image popping away at full opacity
               instead of fading out. So: grow+fade in on mount, then fade out
               when the gate says reveal, then hide. `both` so it starts at
               opacity 0 rather than flashing opaque for one frame. */
            animation: preloaderImageIn 350ms ease-out both;
        }

        @keyframes preloaderImageIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes preloaderImageOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* The reveal script adds .app-revealing when it is time to lift the
           cover. This replaces the entry animation with the exit one, and
           forwards keeps it at opacity 0 until .app-ready hides the overlay. */
        .app-revealing .appLoadingImage {
            animation: preloaderImageOut 250ms ease-in forwards;
        }

        /* Reduced motion: no growth at all. The fades stay, because they are
           what carries the reveal — removing them would make the cover just
           vanish with no explanation. */
        @media (prefers-reduced-motion: reduce) {
            @keyframes preloaderImageIn {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }
        }

        #ui-progress-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            z-index: 1000000;
        }

        #ui-progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 10px;
            transition: width 0.1s linear;
        }
    </style>

</head>

<body>

    <!-- RESTORED: App Loading & Pre-caching Script -->
    <script>
        window.preloadLessonAssets = async function (lessonData, buildVideoUrlFn, buildPosterUrlFn) {
            const progressBar = document.getElementById('ui-progress-bar');
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += (95 - progress) * 0.05;
                if (progressBar) progressBar.style.width = progress + '%';
            }, 100);

            try {
                // High-priority poster preload for lesson intro — ensures the
                // intro rectangle is never empty (LQIP already prevents black).
                // Uses fetch + Image.decode() so the browser caches + decodes it.
                // The poster is keyed by the first step's video slug, not the
                // lessonId (lessonIds are not unique across course configs).
                const posterSlug = lessonData?.steps?.[0]?.introBackgroundVideoUrl;
                if (posterSlug && typeof buildPosterUrlFn === 'function') {
                    try {
                        const posterUrl = buildPosterUrlFn(posterSlug);
                        if (posterUrl) {
                            fetch(posterUrl, { priority: 'high' }).catch(() => {});
                            const pImg = new Image();
                            pImg.decoding = 'async';
                            pImg.fetchPriority = 'high';
                            pImg.src = posterUrl;
                            if (pImg.decode) {
                                await Promise.race([
                                    pImg.decode().catch(() => {}),
                                    new Promise(r => setTimeout(r, 1200))
                                ]);
                            }
                        }
                    } catch (e) {}
                }

                // Preload essential UI images
                const imageUrls = [
                    '/assets/img/header.png',
                    '/assets/img/teacherprofile.webp'];

                const imagePromises = imageUrls.map(url => new Promise(resolve => {
                    const img = new Image();
                    img.onload = resolve;
                    img.onerror = resolve;
                    img.src = url;
                }));

                // Wait for images or 1.5 second timeout, whichever is faster
                await Promise.race([
                    Promise.all(imagePromises),
                    new Promise(resolve => setTimeout(resolve, 1500))
                ]);

                clearInterval(progressInterval);
                if (progressBar) progressBar.style.width = '100%';

                await new Promise(resolve => setTimeout(resolve, 250));
            } catch (error) {
                console.error("Failsafe unlocked preloader:", error);
                clearInterval(progressInterval);
            }
        };
    </script>

    <!-- React Entry (sole entry point after full migration) -->

    <main class="app-container d-flex justify-content-center align-items-center">

        <div id="root" class="video-frame water-surface position-relative shadow-lg">

            <!-- Media Viewport now rendered by React -->

        </div>
            <div id="appLoadingImageDiv">
                <div class="appLoadingImage"></div>
                <div id="ui-progress-container">
                    <div id="ui-progress-bar"></div>
                </div>
            </div>
    </main>

    <!-- Eruda console (gated: ?eruda=1 or localStorage.eruda=1; not loaded for real users) -->
    <script>
        (function () {
            try {
                var params = new URLSearchParams(window.location.search);
                var enabled = params.has('eruda') || (function(){ try { return window.localStorage.getItem('eruda') === '1'; } catch(e){ return false; } })();
                if (!enabled) return;
                var script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/eruda';
                script.onload = function () { eruda.init(); };
                document.body.appendChild(script);
            } catch (e) {}
        })();
    </script>

    <!-- React Entry (sole entry point after full migration) -->
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
