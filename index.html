<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UFF English</title>

    <!-- Google Fonts (loaded non-blocking so the HTML preloader paints immediately) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <!-- Critical inline styles (preloader — must be available before external CSS loads) -->
    <style>
        /* Critical Error State */
        #criticalErrorContainer {
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.85);
            z-index: 10006;
            position: absolute;
            top: 0;
            left: 0;
        }

        #micStatusText {
            color: white !important;
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000,
                0 0 15px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 0, 0, 1) !important;
            z-index: 10007 !important;
            pointer-events: none;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        /* === PRELOADER (kept inline — must render before external CSS loads) === */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Match the Preloader gradient so any gap between the HTML preloader
               hiding and the React Preloader painting shows blue, not black. */
            background: linear-gradient(135deg, #3a8fd5 0%, #00c0d8 100%);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            /* Match Preloader gradient — prevents black flash between the HTML
               preloader hiding and React painting. Overridden to #000 by the
               .app-container rule in app.css once the external stylesheet loads. */
            background: linear-gradient(135deg, #3a8fd5 0%, #00c0d8 100%);
        }

        #appLoadingImageDiv {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3a8fd5 0%, #00c0d8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
        }

        #root:not(:empty) ~ #appLoadingImageDiv {
            display: none !important;
        }

        .appLoadingImage {
            width: 80vw;
            height: 80vh;
            max-width: 800px;
            max-height: 800px;
            background: url('/assets/img/u-f-f.png') no-repeat center center;
            background-size: contain;
        }

        #ui-progress-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            z-index: 1000000;
        }

        #ui-progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 10px;
            transition: width 0.1s linear;
        }
    </style>

</head>

<body>

    <!-- RESTORED: App Loading & Pre-caching Script -->
    <script>
        window.preloadLessonAssets = async function (lessonData, buildVideoUrlFn, buildPosterUrlFn) {
            const progressBar = document.getElementById('ui-progress-bar');
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += (95 - progress) * 0.05;
                if (progressBar) progressBar.style.width = progress + '%';
            }, 100);

            try {
                // Cache-warm ALL lesson videos via fetch() (no blob) — responses
                // stream directly to the browser HTTP disk cache, not JS heap.
                // When each <video> element later requests the same URL with
                // crossOrigin="anonymous", the browser serves it from cache
                // instantly with zero network delay, eliminating FOUC on every
                // video transition throughout the lesson.
                // Fire-and-forget: parallel fetches do not block the loading bar.
                if (lessonData?.steps) {
                    lessonData.steps.forEach(step => {
                        const slug = step.interactiveVideoUrl || step.simpleVideoUrl || step.introBackgroundVideoUrl;
                        if (slug) fetch(buildVideoUrlFn(slug)).catch(() => {});
                    });
                }

                // High-priority poster preload for lesson intro — ensures the
                // intro rectangle is never empty (LQIP already prevents black).
                // Uses fetch + Image.decode() so the browser caches + decodes it.
                if (lessonData?.lessonId && typeof buildPosterUrlFn === 'function') {
                    try {
                        const posterUrl = buildPosterUrlFn(lessonData.lessonId);
                        if (posterUrl) {
                            fetch(posterUrl, { priority: 'high' }).catch(() => {});
                            const pImg = new Image();
                            pImg.decoding = 'async';
                            pImg.fetchPriority = 'high';
                            pImg.src = posterUrl;
                            if (pImg.decode) {
                                await Promise.race([
                                    pImg.decode().catch(() => {}),
                                    new Promise(r => setTimeout(r, 1200))
                                ]);
                            }
                        }
                    } catch (e) {}
                }

                // Preload essential UI images
                const imageUrls = [
                    '/assets/img/header.png',
                    '/assets/img/teacherprofile.webp'];

                const imagePromises = imageUrls.map(url => new Promise(resolve => {
                    const img = new Image();
                    img.onload = resolve;
                    img.onerror = resolve;
                    img.src = url;
                }));

                // Wait for images or 1.5 second timeout, whichever is faster
                await Promise.race([
                    Promise.all(imagePromises),
                    new Promise(resolve => setTimeout(resolve, 1500))
                ]);

                clearInterval(progressInterval);
                if (progressBar) progressBar.style.width = '100%';

                await new Promise(resolve => setTimeout(resolve, 250));
            } catch (error) {
                console.error("Failsafe unlocked preloader:", error);
                clearInterval(progressInterval);
            }
        };
    </script>

    <!-- React Entry (sole entry point after full migration) -->

    <main class="app-container d-flex justify-content-center align-items-center">

        <div id="root" class="video-frame water-surface position-relative shadow-lg">

            <!-- Media Viewport now rendered by React -->

        </div>
            <div id="appLoadingImageDiv">
                <div class="appLoadingImage"></div>
                <div id="ui-progress-container">
                    <div id="ui-progress-bar"></div>
                </div>
            </div>
    </main>

    <!-- Eruda console (always loaded for debugging) -->
    <script>
        (function () {
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/eruda';
            script.onload = function () { eruda.init(); };
            document.body.appendChild(script);
        })();
    </script>

    <!-- React Entry (sole entry point after full migration) -->
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
