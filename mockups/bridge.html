<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaphorical Data Viz - Isometric Bridge over Red Chasm</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            filter: drop-shadow(0 30px 25px rgb(0 0 0 / 0.7));
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <script>
        const skillData = [
            { name: "Listening", weight: 40, score: 30 },
            { name: "Understanding", weight: 30, score: 80 },
            { name: "Pronunciation", weight: 5, score: 40 },
            { name: "Grammar", weight: 5, score: 90 },
            { name: "Flow", weight: 5, score: 60 },
            { name: "Vocabulary", weight: 5, score: 20 },
            { name: "Connected Speech", weight: 5, score: 100 },
            { name: "Formality", weight: 2.5, score: 0 },
            { name: "Native-like", weight: 2.5, score: 50 }
        ];

        const totalBridgeLength = 700;
        const bridgeWidth = 300;
        const plankGap = 10;

        // Z-Axis Depths
        const Z_TOP = 0;              // Surface of the bridge
        const Z_BOTTOM = 35;          // Thickness of the wood
        const Z_CHASM = 80;           // Deep below the bridge (The continuous risk area)

        let currentY = 0;
        let renderQueue = [];

        // --- THE ISOMETRIC PROJECTION ENGINE ---
        function project(x, y, z = 0) {
            const cos = -0.7071;
            const sin = -0.7071;

            const rx = x * cos - y * sin;
            const ry = x * sin + y * cos;

            const screenX = rx + 400;
            const screenY = (ry * 0.5) + 750 + z; // Z drops straight down

            return `${screenX.toFixed(1)},${screenY.toFixed(1)}`;
        }

        // --- 1. GENERATE THE CONTINUOUS RED CHASM ---
        // We draw one massive polygon spanning the entire dimensions of the bridge,
        // pushed deep down to Z_CHASM.
        const C1 = project(0, 0, Z_CHASM);
        const C2 = project(bridgeWidth, 0, Z_CHASM);
        const C3 = project(bridgeWidth, totalBridgeLength, Z_CHASM);
        const C4 = project(0, totalBridgeLength, Z_CHASM);

        const continuousChasmSVG = `
            <polygon 
                points="${C1} ${C2} ${C3} ${C4}" 
                fill="rgba(239, 68, 68, 0.35)" 
                stroke="rgba(239, 68, 68, 0.6)" 
                stroke-width="2" 
                filter="url(#red-glow)" 
            />
        `;

        // --- 2. MATHEMATICAL RENDERING OF THE PLANKS ---
        skillData.forEach((skill, index) => {

            const allocatedY = (skill.weight / 100) * totalBridgeLength;
            const actualPlankLengthY = allocatedY - plankGap;

            let fillWidthX = 0;
            let fillLengthY = 0;
            let currentPlankSVG = '';

            // CALCULATE THE 3D WOODEN BLOCKS
            if (skill.score > 0) {
                if (index === 0 || index === 1) {
                    fillWidthX = bridgeWidth;
                    fillLengthY = actualPlankLengthY * (skill.score / 100);
                } else {
                    fillWidthX = bridgeWidth * (skill.score / 100);
                    fillLengthY = actualPlankLengthY;
                }

                // Top Corners (Z = 0)
                const T1 = project(0, currentY, Z_TOP);
                const T2 = project(fillWidthX, currentY, Z_TOP);
                const T3 = project(fillWidthX, currentY + fillLengthY, Z_TOP);
                const T4 = project(0, currentY + fillLengthY, Z_TOP);

                // Bottom Corners (Z = 35)
                const B1 = project(0, currentY, Z_BOTTOM);
                const B2 = project(fillWidthX, currentY, Z_BOTTOM);
                const B4 = project(0, currentY + fillLengthY, Z_BOTTOM);

                const depthRatio = currentY / totalBridgeLength;
                const topOpacity = 1 - (depthRatio * 0.3);

                // Right Face (Darkest Shadow)
                currentPlankSVG += `<polygon points="${T1} ${T4} ${B4} ${B1}" fill="rgba(110, 90, 78, ${topOpacity})" stroke="#5a4d43" stroke-linejoin="round" />`;
                // Left Face (Medium Shadow)
                currentPlankSVG += `<polygon points="${T1} ${T2} ${B2} ${B1}" fill="rgba(140, 116, 101, ${topOpacity})" stroke="#7a675d" stroke-linejoin="round" />`;
                // Top Face (Bright Surface)
                currentPlankSVG += `<polygon points="${T1} ${T2} ${T3} ${T4}" fill="rgba(181, 157, 140, ${topOpacity})" stroke="#a38c7f" stroke-linejoin="round" />`;
            }

            // DRAW THE MAXIMUM BORDER (Solid, clear white line at Z=0)
            const M1 = project(0, currentY, Z_TOP);
            const M2 = project(bridgeWidth, currentY, Z_TOP);
            const M3 = project(bridgeWidth, currentY + actualPlankLengthY, Z_TOP);
            const M4 = project(0, currentY + actualPlankLengthY, Z_TOP);

            currentPlankSVG += `<polygon points="${M1} ${M2} ${M3} ${M4}" fill="transparent" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />`;

            renderQueue.push(currentPlankSVG);
            currentY += allocatedY;
        });

        // --- PAINTERS ALGORITHM ---
        // Draws back-to-front so front wood properly covers back wood
        renderQueue.reverse();

        const finalSVG = `
            <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <filter id="red-glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                ${continuousChasmSVG}

                ${renderQueue.join('')}

            </svg>
        `;

        document.getElementById('canvas-container').innerHTML = finalSVG;
    </script>
</body>

</html>
