<style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');

    .phone-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 0 32px;
    }

    .phone {
        width: 320px;
        height: 620px;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        background: #0a0a0f;
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.08), 0 32px 80px rgba(0, 0, 0, 0.5);
        font-family: 'DM Sans', sans-serif;
    }

    /* --- New Video & Play Button Styles --- */
    .video-wrapper {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 0;
    }

    .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .big-play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 20;
        transition: all 0.3s ease;
    }

    .big-play-btn svg {
        width: 32px;
        height: 32px;
        fill: white;
        margin-left: 6px;
        /* Optical center alignment for the play triangle */
    }

    .big-play-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translate(-50%, -50%) scale(1.05);
    }

    .big-play-btn.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.9);
    }

    /* -------------------------------------- */

    .top-hud {
        position: absolute;
        top: 16px;
        left: 12px;
        right: 12px;
        background: rgba(10, 15, 22, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 10;
    }

    .close-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
    }

    .close-btn svg {
        width: 12px;
        height: 12px;
        stroke: rgba(255, 255, 255, 0.6);
        stroke-width: 2.5;
    }

    .progress-bar-track {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
    }

    .progress-bar-fill {
        width: 38%;
        height: 100%;
        background: linear-gradient(90deg, #3ecfb2, #5de0cf);
        border-radius: 2px;
    }

    .bot-avatars {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
        align-items: center;
    }

    .bot-slot {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .bot-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        overflow: visible;
        position: relative;
        flex-shrink: 0;
    }

    .bot-avatar svg.ring-svg {
        position: absolute;
        inset: -3px;
        width: calc(100% + 6px);
        height: calc(100% + 6px);
        transform: rotate(-90deg);
    }

    .bot-face {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #1e2f42;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
    }

    .bot-score {
        font-size: 10px;
        font-weight: 600;
        color: #3ecfb2;
        letter-spacing: -0.02em;
    }

    .bot-sep {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.1);
    }

    .bottom-panel {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 14px 20px 30px;
        background: linear-gradient(180deg, transparent 0%, rgba(6, 10, 18, 0.88) 30%, rgba(5, 8, 15, 0.98) 65%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .mission-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .mission-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #3ecfb2;
    }

    .mission-text {
        font-size: 13px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.85);
        margin-left: 6px;
    }

    .info-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
    }

    .info-btn svg {
        width: 9px;
        height: 9px;
        stroke: rgba(255, 255, 255, 0.4);
        stroke-width: 2;
    }

    .divider {
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.07);
        margin-bottom: 12px;
    }

    .prompt-block {
        text-align: center;
        margin-bottom: 16px;
    }

    .prompt-main {
        font-family: 'DM Serif Display', serif;
        font-size: 17px;
        color: rgba(255, 255, 255, 0.92);
    }

    .prompt-translation {
        font-size: 13px;
        font-style: italic;
        color: rgba(255, 255, 255, 0.35);
        margin-left: 6px;
    }

    .mic-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07);
        border: 1.5px solid rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.1s;
        position: relative;
    }

    .mic-btn:hover {
        background: rgba(255, 255, 255, 0.11);
    }

    .mic-btn:active {
        transform: scale(0.93);
    }

    .mic-btn.active {
        background: rgba(62, 207, 178, 0.14);
        border-color: rgba(62, 207, 178, 0.5);
    }

    .mic-ring {
        position: absolute;
        border-radius: 50%;
        border: 1.5px solid rgba(62, 207, 178, 0.35);
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        opacity: 0;
        pointer-events: none;
    }

    .mic-btn.active .mic-ring:nth-child(1) {
        animation: ring-expand 2s ease-out 0s infinite;
    }

    .mic-btn.active .mic-ring:nth-child(2) {
        animation: ring-expand 2s ease-out 0.65s infinite;
    }

    .mic-btn.active .mic-ring:nth-child(3) {
        animation: ring-expand 2s ease-out 1.3s infinite;
    }

    @keyframes ring-expand {
        0% {
            transform: scale(1);
            opacity: 0.7;
        }

        100% {
            transform: scale(2.6);
            opacity: 0;
        }
    }
</style>

<h2 class="sr-only">uffenglish video call screen with HUD, bot scores, mission prompt, and mic button with radiating
    rings</h2>

<div class="phone-wrap">
    <div class="phone">

        <!-- Replaced avatar background with Video Player -->
        <div class="video-wrapper">
            <video id="bgVideo" src="https://ultrafastfluency.com/wp-content/test.mp4" playsinline loop></video>
            <button class="big-play-btn" id="playBtn" aria-label="Play video">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
        </div>

        <div class="top-hud">
            <div class="close-btn" aria-label="Exit lesson">
                <svg viewBox="0 0 12 12" fill="none">

                    <line x1="11" y1="1" x2="1" y2="11" />
                </svg>
            </div>
            <div class="progress-bar-track" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="bot-avatars">
                <div class="bot-slot">
                    <div class="bot-avatar">
                        <svg class="ring-svg" viewBox="0 0 34 34" fill="none">
                            <circle cx="17" cy="17" r="15" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />
                            <circle cx="17" cy="17" r="15" stroke="#3ecfb2" stroke-width="2.5" stroke-linecap="round"
                                stroke-dasharray="94.2" stroke-dashoffset="0" />
                        </svg>
                        <div class="bot-face">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="3" width="18" height="18" rx="5" fill="#2a4058" />
                                <circle cx="9" cy="10" r="2" fill="#3ecfb2" />
                                <circle cx="15" cy="10" r="2" fill="#3ecfb2" />
                                <path d="M8 16 Q12 13 16 16" stroke="#3ecfb2" stroke-width="1.5" stroke-linecap="round"
                                    fill="none" />
                            </svg>
                        </div>
                    </div>
                    <span class="bot-score">100%</span>
                </div>
                <div class="bot-sep"></div>
                <div class="bot-slot">
                    <div class="bot-avatar">
                        <svg class="ring-svg" viewBox="0 0 34 34" fill="none">
                            <circle cx="17" cy="17" r="15" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />
                            <circle cx="17" cy="17" r="15" stroke="#3ecfb2" stroke-width="2.5" stroke-linecap="round"
                                stroke-dasharray="94.2" stroke-dashoffset="0" />
                        </svg>
                        <div class="bot-face">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="3" width="18" height="18" rx="5" fill="#2a4058" />
                                <circle cx="9" cy="10" r="2" fill="#3ecfb2" />
                                <circle cx="15" cy="10" r="2" fill="#3ecfb2" />
                                <path d="M6 16 L8 13 M18 16 L16 13" stroke="#3ecfb2" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>
                        </div>
                    </div>
                    <span class="bot-score">100%</span>
                </div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="mission-row">
                <div>
                    <span class="mission-label">Mission</span>
                    <span class="mission-text">Order a soft drink</span>
                </div>
                <div class="info-btn" aria-label="Mission info">
                    <svg viewBox="0 0 10 10" fill="none">
                        <circle cx="5" cy="5" r="4" />
                        <line x1="5" y1="4" x2="5" y2="7.5" stroke-linecap="round" />
                        <circle cx="5" cy="2.5" r="0.5" fill="rgba(255,255,255,0.4)" stroke="none" />

            </div>
            <div class="divider"></div>
            <div class="prompt-block">
                <span class="prompt-main">Respond.</span>
                <span class="prompt-translation">Responde.</span>
            </div>

            <button class="mic-btn" id="micBtn" aria-label="Toggle microphone" aria-pressed="false">
                <div class="mic-ring" aria-hidden="true"></div>
                <div class="mic-ring" aria-hidden="true"></div>
                <div class="mic-ring" aria-hidden="true"></div>
                <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <line x1="3" y1="3" x2="21" y2="21" stroke="rgba(255,255,255,0.5)" stroke-width="1.8"
                        stroke-linecap="round" />

                        stroke-linecap="round" />

        </div>

    </div>
</div>

<script>
    // Original Mic Button Logic
    const btn = document.getElementById('micBtn');
    const icon = document.getElementById('micIcon');

    const mutedSVG = `
    <line x1="3" y1="3" x2="21" y2="21" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V6a3 3 0 0 0-5.94-.6" stroke="rgba(255,255,255,0.65)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="12" y1="19" x2="12" y2="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/>`;

    const activeSVG = `
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke="rgba(62,207,178,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke="rgba(62,207,178,0.9)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="12" y1="19" x2="12" y2="22" stroke="rgba(62,207,178,0.9)" stroke-width="1.8" stroke-linecap="round"/>`;

    let active = false;
    btn.addEventListener('click', () => {
        active = !active;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', String(active));
        icon.innerHTML = active ? activeSVG : mutedSVG;
    });

    // New Video & Play Button Logic
    const video = document.getElementById('bgVideo');
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', () => {
        video.play();
        playBtn.classList.add('hidden');
    });

    // Optional: Pause video if user taps on the video area itself
    video.addEventListener('click', () => {
        if (!video.paused) {
            video.pause();
            playBtn.classList.remove('hidden');
        }
    });
</script>
