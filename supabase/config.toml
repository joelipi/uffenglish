# supabase/config.toml — Supabase CLI config
# Generated for uffenglish migration from Appwrite.
# Project: jbrbmbmupjfangqvaevx (https://jbrbmbmupjfangqvaevx.supabase.co)
# GitHub integration: main branch auto-deploys migrations.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
image_transformation_enabled = true

[auth]
enabled = true
port = 54325
# The PUBLIC site. Supabase falls back to this URL whenever a client-supplied
# redirect is not on the allow-list below, and GoTrue puts it in the verify link
# of every auth email — a `http://localhost:3000` here emailed learners a dead
# link (2026-11). Local dev is served by the localhost entries in
# additional_redirect_urls, not by site_url.
site_url = "https://ultrafastfluency.com"
additional_redirect_urls = [
  "https://ultrafastfluency.com",
  "https://www.ultrafastfluency.com",
  "https://s.ultrafastfluency.com",
  "https://uffenglish.pages.dev",
  "http://localhost:3000",
  "http://localhost:5173",
]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
external_anonymous_users_enabled = false
password_min_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.external.google]
enabled = false

[auth.third_party_auth]
enabled = false
